name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cat VERSION)"

          if [ "$expected" != "$actual" ]; then
            echo "Tag version: $expected"
            echo "VERSION file: $actual"
            exit 1
          fi

      - name: Verify executable
        run: |
          test -f bin/work
          test -x bin/work

      - name: Prepare Linux x86_64 asset
        run: |
          cp bin/work work-linux-x86_64
          chmod +x work-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            work-linux-x86_64

